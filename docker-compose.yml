version: '3.8'

services:

  # Application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: selfhosted-agents
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://agent:agent@postgres:5432/agent_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - ALLOWED_ROOT=/workspace
      - LLM_PROVIDER=openai
      - MODEL_NAME=gpt-4o-mini
      - MAX_TOKENS_PER_TASK=4000
      - MAX_STEPS_PER_TASK=10
      - DEBUG=true
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=agent
      - POSTGRES_DB=agent_db
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/workspace
    depends_on:
      - redis
      - postgres

  # Redis service for Task Queue
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # PostgreSQL service for production database
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=agent
      - POSTGRES_DB=agent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Langfuse Observability (optional)
  # Uncomment if you want to include Langfuse self-hosted
  # langfuse:
  #   image: ghcr.io/langfuse/langfuse:2.12.0
  #   container_name: langfuse
  #   restart: unless-stopped
  #   environment:
  #     - PUBLIC_KEY=langfuse-cloud
  #     - SECRET_KEY=langfuse-cloud-secret
  #     - DATABASE_URL=postgres://agent:agent@postgres:5432/agent_db
  #     - REDIS_URL=redis://redis:6379
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - postgres
  #     - redis
  #   restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  # langfuse_data: